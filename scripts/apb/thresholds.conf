# thresholds.conf (apb / Meta) — the data-sufficiency floor the batch scripts use
# to decide "does this entity have enough data to judge?". Versioned surface:
# tune the values, but keep the schema line. Defaults mirror apb's own compiled
# constants in rust/crates/apb-core/src/common.rs so scripts and playbooks agree
# on what "enough data" means.
#
# key=value, one per line. Lines starting with # are comments.

thresholds_schema=1

# Minimum conversions over the lookback before an entity is judgeable.
# Mirrors LOW_CONVERSION_VOLUME = 10.0 (common.rs). SCALE_CONVERSION_MIN = 20.0 is
# the higher bar the scaling scans use; this is the general floor.
min_conversions=10

# Minimum spend (USD) over the lookback. Mirrors MEANINGFUL_SPEND_USD = 50.0
# (common.rs) — below this apb's own playbooks treat a segment as too thin to flag.
min_spend_usd=50

# Minimum impressions over the lookback. No single compiled constant; heuristic
# delivery floor (well under one day of a healthy active ad set) so a barely-served
# entity is reported "keep collecting" rather than judged.
min_impressions=1000

# Minimum audience size / signal volume where audiences are the subject (LAL seed,
# custom-audience refresh). Heuristic — Meta's practical LAL seed floor (~1000);
# no compiled constant. Used by Tier 2 audience scans.
min_audience_size=1000

# Default lookback (days) reported in the "keep collecting" message. Mirrors the
# apb `report insights --days` default (30) / build_time_range(30) in common.rs.
lookback_days_default=30

# Max opportunities a Tier-2 opportunity scan proposes per run (doctrine: "max K
# proposed changes per run, largest-impact first" — the rest are reported as
# `deferred_next_review`, not dropped). S5b.
change_budget=3
