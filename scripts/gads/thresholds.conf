# thresholds.conf (apb-gads / Google Ads) — the data-sufficiency floor the batch
# scripts use to decide "does this entity have enough data to judge?". Versioned
# surface: tune the values, keep the schema line. Defaults mirror apb-gads's own
# metric-policy compiled defaults (rust/gads/crates/ads-core/src/config.rs +
# client/playbooks_impl.rs::resolve_metric) so scripts and playbooks agree on what
# "enough data" means.
#
# key=value, one per line. Lines starting with # are comments.

thresholds_schema=1

# Minimum conversions over the lookback before an entity is judgeable.
# Mirrors resolve_metric's compiled default min_conversions = 1.0 (playbooks_impl.rs /
# SearchTermPromotionPolicy comment "Default 1.0"). Google's smart-bidding math also
# treats sub-1-conversion entities as unmeasurable.
min_conversions=1

# Minimum spend (USD) over the lookback. Mirrors KeywordPruneAuditPolicy
# min_cost_micros default = 50_000_000 micros ($50) (config.rs) — the spend floor
# apb-gads uses before it will call a keyword "wasted spend".
min_spend_usd=50

# Minimum impressions over the lookback. No single compiled default (the # -mode
# floors are opt-in/unset); heuristic delivery floor so a barely-served entity is
# reported "keep collecting" rather than judged.
min_impressions=1000

# Minimum audience / user-list size where audiences are the subject. Heuristic —
# Google's practical remarketing-list serving floor (~1000 for Search); no
# compiled constant. Used by Tier 2 audience scans.
min_audience_size=1000

# Default lookback (days) reported in the "keep collecting" message. Kept at 30 to
# match the common short-window playbook default (budget-pacing / anomaly cadence);
# each playbook echoes its own resolved lookback_days.
lookback_days_default=30

# watch-fatigue: whether AVERAGE ad_strength counts as a refresh candidate.
# 0 (default) flags only POOR/LOW — on busy accounts most RSAs sit at AVERAGE,
# so including it drowns the real decay signal (calibrated live 2026-07-17).
# Set 1 for aggressive creative-refresh programs.
fatigue_include_average=0

# watch-tracking-health: whether REMOVED conversion actions are flagged.
# 0 (default) skips them — a REMOVED action no longer feeds Smart Bidding, so a
# long-removed one is historical cleanup, not breakage, and it would be re-flagged
# every day forever. HIDDEN/UNVERIFIED/INACTIVE/etc. on live actions still flag.
# Set 1 to audit removals too (e.g. right after a tracking migration).
tracking_flag_removed=0

# Max opportunities a Tier-2 opportunity scan proposes per run (doctrine: "max K
# proposed changes per run, largest-impact first" — the rest are reported as
# `deferred_next_review`, not dropped). S5b.
change_budget=3
